# Stack local: PostgreSQL + migrações + API .NET + front-end Nuxt.
# O serviço de ML fica atrás do profile "ml" e o treino do profile "jobs".
# Segredos: defina em um arquivo .env (NÃO versionado). Veja .env.example.
#
# Uso:
#   cp .env.example .env   # preencha os segredos
#   docker compose up --build
#
# O front-end é construído do repositório irmão ../fabrica-projetos-vi.
# Use FRONTEND_PATH para apontar para outro caminho.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mvp
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp -d mvp"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ./mvp
      target: migrate
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=mvp;Username=mvp;Password=${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  ml:
    profiles: ["ml"]
    build: ./ml
    environment:
      ML_API_KEY: ${ML_API_KEY:?defina ML_API_KEY (>=24 chars)}
      ML_DATABASE_URL: postgresql+psycopg://ml_reader:${ML_READER_PASSWORD:?defina ML_READER_PASSWORD}@db:5432/mvp
    volumes: ["models:/models"]
    depends_on:
      db: { condition: service_healthy }

  ml-train:
    build: ./ml
    profiles: ["jobs"]
    command: ["redistml", "train", "--db-url", "postgresql+psycopg://ml_reader:${ML_READER_PASSWORD}@db:5432/mvp", "--models-dir", "/models"]
    volumes: ["models:/models"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./mvp
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=mvp;Username=mvp;Password=${POSTGRES_PASSWORD}
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY:?defina JWT_PRIVATE_KEY (>=40 chars)}
      Jwt__ExpirationHours: "8"
      MlService__BaseUrl: http://ml:8000/
      MlService__ApiKey: ${ML_API_KEY}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-3000}
      Cors__AllowedOrigins__1: http://127.0.0.1:${FRONTEND_PORT:-3000}
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ${FRONTEND_PATH:-../fabrica-projetos-vi}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    environment:
      NUXT_PUBLIC_USE_MOCKS: "false"
      NUXT_PUBLIC_API_BASE_URL: http://localhost:5080
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  models:
