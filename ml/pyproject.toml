[project]
name = "redistml"
version = "0.1.0"
description = "Previsão de demanda (séries temporais) e recomendação de remanejamento de medicamentos para evitar vencimento"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
sql = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "sqlalchemy>=2.0", "pyarrow>=15"]

[project.scripts]
redistml = "redistml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
